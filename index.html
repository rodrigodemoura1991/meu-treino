<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Meu Treino — Musculação</title>
<link rel="stylesheet" href="style.css?v=20260817c">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style id="force-light">
:root{color-scheme:light!important}html,body{background:#f4f6f8!important;color:#17212b!important}.top{background:#fff!important;color:#17212b!important}.main{background:transparent!important}.exercise,.card,.stat,.hero{background:#fff!important;color:#17212b!important;border-color:#dfe4ea!important}.field,.obs,.notes,.metrics input,.metrics select,.select{background:#fff!important;color:#17212b!important;border-color:#cfd6de!important}.setno{background:#eef1f4!important;color:#66717d!important}
.exercise-photo{position:relative!important;display:block!important;flex:0 0 96px!important;width:96px!important;height:78px!important;border-radius:12px!important;overflow:hidden!important;background:#e9edf2!important;border:1px solid #d7dde4!important}.exercise-photo img{width:100%!important;height:100%!important;object-fit:cover!important;display:block!important}.exercise-photo .photo-fallback{height:100%;display:grid;place-items:center;font-size:28px}
.exercise-info{min-width:0!important;flex:1!important}.exhead{display:flex!important;align-items:center!important;gap:12px!important}.photo-source{font-size:8px!important;color:#9aa2ad!important;margin-top:5px!important;text-align:right!important}
@media(max-width:430px){.exercise-photo{flex-basis:88px!important;width:88px!important;height:74px!important}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><div class="brandmark">🏋️</div><div>MEU TREINO<small>MUSCULAÇÃO • PROGRESSÃO</small></div></div><div id="cloudStatus" class="status">☁ Offline/local</div></div></header>
<main class="main"><div id="app"></div></main>
<nav id="footnav" class="footnav"></nav>
<script src="musculacao.js?v=20260817c"></script>
<script src="fotos.js?v=20260817c"></script>
<script src="visual.js?v=20260817c"></script>
<script>
(function(){
  try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}catch(e){}
  function addPhotos(){
    document.querySelectorAll('.exercise').forEach(function(card){
      if(card.querySelector('.exercise-photo'))return;
      var title=card.querySelector('.exname');
      var head=card.querySelector('.exhead');
      if(!title||!head)return;
      var name=title.textContent.replace(/^\d+\.\s*/,'').trim();
      var map=window.EXERCISE_PHOTOS||{};
      var url=map[name]||'https://commons.wikimedia.org/wiki/Special:Redirect/file/Training_Hard.jpg';
      var photo=document.createElement('div');photo.className='exercise-photo';
      var img=document.createElement('img');img.loading='lazy';img.alt='Foto do exercício '+name;img.src=url;
      img.onerror=function(){photo.innerHTML='<div class="photo-fallback">🏋️</div>'};
      photo.appendChild(img);
      var info=document.createElement('div');info.className='exercise-info';
      while(title.parentElement&&title.parentElement.firstChild)info.appendChild(title.parentElement.firstChild);
      head.innerHTML='';head.appendChild(photo);head.appendChild(info);
    });
  }
  var observer=new MutationObserver(addPhotos);observer.observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(addPhotos,100);setTimeout(addPhotos,500);setTimeout(addPhotos,1500);
})();
</script>
</body>
</html>
