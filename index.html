<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Treino — Histórico e Progressão</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--txt:#17202a;--muted:#667085;--line:#e4e7ec;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{background:#111827;color:#fff;padding:16px;position:sticky;top:0;z-index:10}.head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:21px;font-weight:800}.cloud{padding:8px 11px;border-radius:9px;font-size:12px;background:#92400e}.online{background:#166534}.main{max-width:1200px;margin:16px auto;padding:0 12px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab{border:0;border-radius:10px;padding:10px 14px;font-weight:800;white-space:nowrap;cursor:pointer;background:#e5e7eb}.tab.active{background:var(--blue);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}h2{margin:0 0 8px;font-size:20px}h3{margin:18px 0 8px;font-size:16px}.muted{color:var(--muted);font-size:13px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase}.scroll{overflow:auto}input,textarea,select{font:inherit;border:1px solid #d0d5dd;border-radius:8px;padding:8px;width:100%;background:#fff}button{border:0;border-radius:8px;padding:9px 12px;font-weight:750;cursor:pointer;background:#e5e7eb}.primary{background:var(--blue);color:#fff}.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:12px;font-weight:800}.up{background:#dcfce7;color:#166534}.keep{background:#fef3c7;color:#92400e}.down{background:#fee2e2;color:#991b1b}.empty{padding:18px;text-align:center;color:var(--muted)}.workout-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.workout-metrics label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}.workout-metrics input,.workout-metrics select{min-height:42px}.effort-hint{font-size:11px;color:var(--muted);margin-top:4px}.auth{max-width:430px;margin:8vh auto}.auth input{margin-bottom:10px}.metric{display:inline-flex;flex-direction:column;min-width:125px;margin:4px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.metric b{font-size:21px}.history-grid{display:grid;grid-template-columns:300px 1fr;gap:14px}.history-stat{display:flex;gap:8px;flex-wrap:wrap}.history-stat .metric{margin:0}.history-row{background:#f8fafc;border-radius:10px;padding:10px;margin-bottom:8px}.history-row b{font-size:15px}.exercise-select{max-width:480px}@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}.workout-metrics{grid-template-columns:1fr 1fr}.history-grid{grid-template-columns:1fr}}@media print{header,.tabs,.actions,.no-print{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
</style></head>
<body>
<header><div class="head"><div class="title">🏋️ Meu Treino</div><div id="cloudStatus" class="cloud">☁ Offline/local</div></div></header>
<main class="main"><div id="app"></div></main>
<script>
const SUPABASE_URL="https://uvujytjdafcyacawcirp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable__mofqtls_ru76dDkIJbIew_G2f_wUKE";
const KEY="meu_treino_pro_v2";
const workouts={
"Segunda":{icon:"🟢",title:"Pernas + Peito",ex:[["Abdominal máquina",3,"12–15"],["Pêndulo",4,"6–10"],["Cadeira extensora",3,"10–15"],["Stiff com barra ou halteres",3,"8–10"],["Supino inclinado com halteres",4,"8–10"],["Supino reto máquina",3,"8–12"],["Crucifixo máquina",2,"12–15"]]},
"Terça":{icon:"🔵",title:"Costas + Bíceps",ex:[["Barra fixa ou puxada neutra",4,"6–10"],["Remada articulada com apoio no peito",4,"8–12"],["Remada unilateral na polia",3,"10–12"],["PULLDOWN",3,"10–15"],["Rosca direta com barra W",3,"8–12"],["Rosca inclinada com halteres",3,"10–12"],["Rosca martelo com halteres",2,"10–12"]]},
"Quarta":{icon:"🟠",title:"Pernas + Ombros",ex:[["Abdominal máquina",3,"12–15"],["Leg press 45°",4,"8–12"],["Elevação pélvica",3,"8–12"],["Cadeira flexora bilateral",4,"8–12"],["Mesa flexora",3,"10–15"],["Desenvolvimento máquina",3,"8–10"],["Elevação lateral na polia",4,"10–15"],["Crucifixo inverso máquina",3,"12–15"],["Panturrilha em pé ou no leg press",4,"10–15"]]},
"Quinta":{icon:"🔴",title:"Peito + Tríceps",ex:[["Supino reto com barra",4,"6–10"],["Supino inclinado máquina",3,"8–12"],["Supino reto máquina",3,"8–12"],["Crossover de baixo para cima",2,"12–15"],["Tríceps francês unilateral na polia",3,"10–12"],["Tríceps barra V",3,"8–12"],["Tríceps testa com barra W",2,"10–12"]]},
"Sexta":{icon:"🟣",title:"Full Body + Pontos fracos",ex:[["Abdominal máquina",3,"12–15"],["Hack squat",3,"8–12"],["Flexora unilateral",3,"10–12"],["Remada baixa triângulo",3,"8–12"],["Puxada alta pronada",3,"8–12"],["Supino inclinado com halteres",3,"8–12"],["Elevação lateral",3,"12–15"],["Rosca Scott máquina",2,"10–12"],["Tríceps corda",2,"10–15"],["Panturrilha",4,"12–15"]]}};
const sat=[["Elevação lateral",3,"12–15"],["Crucifixo inverso",3,"12–15"],["Rosca martelo",3,"10–12"],["Tríceps corda",3,"10–12"],["Panturrilha",4,"12–15"]];
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{logs:{}},current="Segunda",user=null,cloudReady=false,cloudTimer=null,sb=null,historyExercise="Pêndulo";
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function key(day,date){return day+"|"+date}
function dateBR(d){return new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})}
function status(t,online){const e=document.getElementById("cloudStatus");if(e){e.textContent=t;e.className="cloud "+(online?"online":"")}}
function localSave(){localStorage.setItem(KEY,JSON.stringify(data));status(user&&cloudReady?"☁ Online • salvo":"☁ Offline/local",!!(user&&cloudReady))}
function ensure(k,day,date){if(!data.logs[k])data.logs[k]={day,date,rows:{},notes:""};return data.logs[k]}
function makeClient(){if(window.supabase&&window.supabase.createClient){try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);return true}catch(e){console.error(e)}}return false}
async function cloudSaveLog(k){if(!user||!cloudReady||!sb)return;const l=data.logs[k];if(!l)return;const {error}=await sb.from("workout_logs").upsert({user_id:user.id,log_key:k,day:l.day,workout_date:l.date,payload:l,updated_at:new Date().toISOString()},{onConflict:"user_id,log_key"});if(error){console.error(error);status("⚠ Erro ao salvar online",false)}else status("☁ Online • salvo",true)}
function queueCloudSave(k){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSaveLog(k),500)}
async function cloudLoad(){if(!user||!sb)return;const {data:rows,error}=await sb.from("workout_logs").select("log_key,payload").order("workout_date",{ascending:false});if(error){console.error(error);cloudReady=false;status("⚠ Não foi possível acessar a nuvem",false);return}cloudReady=true;const localLogs={...data.logs};if(rows.length===0&&Object.keys(localLogs).length){for(const k of Object.keys(localLogs))await cloudSaveLog(k)}else{for(const r of rows){if(r.payload)data.logs[r.log_key]=r.payload}for(const k of Object.keys(localLogs)){if(!rows.some(r=>r.log_key===k))await cloudSaveLog(k)}}localSave();render()}
async function signUp(){const email=(document.getElementById("email")?.value||"").trim(),password=document.getElementById("password")?.value||"";if(!email||password.length<6){alert("Informe um e-mail e uma senha de pelo menos 6 caracteres.");return}if(!sb){alert("A conexão online ainda não carregou. Recarregue a página e tente novamente.");return}const {error}=await sb.auth.signUp({email,password});if(error)alert(error.message);else alert("Conta criada. Se pedir confirmação, confirme seu e-mail e depois entre.")}
async function signIn(){const email=(document.getElementById("email")?.value||"").trim(),password=document.getElementById("password")?.value||"";if(!sb){alert("A conexão online ainda não carregou. Recarregue a página e tente novamente.");return}const {data:r,error}=await sb.auth.signInWithPassword({email,password});if(error){alert(error.message);return}user=r.user;status("☁ Conectando…",true);await cloudLoad()}
async function signOut(){if(sb)await sb.auth.signOut();user=null;cloudReady=false;status("☁ Offline/local",false);render()}
function authPage(){document.getElementById("app").innerHTML=`<div class="card auth"><h2>☁ Meu Treino Online</h2><p class="muted">Entre para salvar seus treinos na nuvem e acessar o histórico em outros aparelhos.</p><input id="email" type="email" placeholder="Seu e-mail"><input id="password" type="password" placeholder="Senha (mínimo 6 caracteres)"><div class="actions"><button class="primary" onclick="signIn()">Entrar</button><button onclick="signUp()">Criar conta</button></div><p class="muted">Os treinos já salvos neste aparelho serão enviados para a nuvem no primeiro acesso.</p></div>`}
function tabs(){return Object.keys(workouts).map(d=>`<button class="tab ${current===d?"active":""}" onclick="go('${d}')">${workouts[d].icon} ${d}</button>`).join("")+`<button class="tab ${current==="Sábado"?"active":""}" onclick="go('Sábado')">🟣 Sábado*</button><button class="tab ${current==="Relatórios"?"active":""}" onclick="go('Relatórios')">📊 Relatórios</button><button class="tab ${current==="Histórico"?"active":""}" onclick="go('Histórico')">📈 Histórico</button><button class="tab ${current==="Dados"?"active":""}" onclick="go('Dados')">⚙️ Dados</button>`}
function nav(){return `<div class="tabs">${tabs()}</div>`}
function go(x){current=x;render()}
function setsFor(row,n,i,k){let out="";for(let s=0;s<n;s++)out+=`<div class="grid"><input type="number" step="0.5" placeholder="kg" value="${esc(row?.["kg"+s]??"")}" onchange="put('${k}',${i},${s},'kg',this.value)"><input type="number" placeholder="reps" value="${esc(row?.["reps"+s]??"")}" onchange="put('${k}',${i},${s},'reps',this.value)"></div>`;return out}
function put(k,i,s,f,v){const l=ensure(k,current,today());l.rows[i]??={};l.rows[i][f+s]=v;localSave();queueCloudSave(k);renderSuggestion(k,i)}
function setObservation(k,i,v){const l=ensure(k,current,today());l.rows[i]??={};l.rows[i].observation=v;localSave();queueCloudSave(k)}
function setMetric(k,f,v){const l=ensure(k,current,today());l[f]=v;localSave();queueCloudSave(k)}
function renderMetrics(l,k){return `<div class="card"><h3>📊 Dados do treino</h3><div class="workout-metrics"><div><label>Tempo de treino</label><input type="text" placeholder="Ex.: 1h 05min" value="${esc(l.duration||"")}" onchange="setMetric('${k}','duration',this.value)"></div><div><label>BPM médio</label><input type="number" min="0" step="1" placeholder="Ex.: 119" value="${esc(l.avgBpm||"")}" onchange="setMetric('${k}','avgBpm',this.value)"></div><div><label>Calorias gastas</label><input type="number" min="0" step="1" placeholder="Ex.: 507" value="${esc(l.calories||"")}" onchange="setMetric('${k}','calories',this.value)"></div><div><label>Grau de esforço</label><select onchange="setMetric('${k}','effort',this.value)"><option value="">Selecione</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${String(l.effort)===String(i+1)?"selected":""}>${i+1}/10${i===0?" — muito leve":i===9?" — máximo":""}</option>`).join("")}</select><div class="effort-hint">1 = muito leve • 10 = máximo</div></div></div></div>`}
function renderWorkout(){const ex=current==="Sábado"?sat:workouts[current].ex,d=today(),k=key(current,d),l=ensure(k,current,d);const rows=ex.map((e,i)=>{const r=l.rows[i]||{};return `<tr><td><b>${i+1}. ${esc(e[0])}</b><div class="muted">Meta ${e[2]} • ${e[1]} séries</div></td><td>${setsFor(r,e[1],i,k)}</td><td><textarea rows="2" placeholder="Observação deste exercício" onchange="setObservation('${k}',${i},this.value)">${esc(r.observation||"")}</textarea><div id="sug${i}" class="muted"></div></td></tr>`}).join("");document.getElementById("app").innerHTML=nav()+`<div class="card"><h2>${workouts[current]?.icon||"🟣"} ${current} — ${workouts[current]?.title||"Treino opcional"}</h2><div class="muted">${dateBR(d)} • Dados salvos automaticamente.</div></div><div class="card scroll"><table><thead><tr><th>Exercício</th><th>Séries — kg / reps</th><th>Observações</th></tr></thead><tbody>${rows}</tbody></table><h3>Observações gerais</h3><textarea rows="3" onchange="const x=ensure('${k}','${current}','${d}');x.notes=this.value;localSave();queueCloudSave('${k}')" placeholder="Energia, dor, técnica, falha…">${esc(l.notes||"")}</textarea><div class="actions"><button class="primary" onclick="window.print()">🖨️ Relatório diário</button><button onclick="clearDay()">Limpar dia</button></div></div>${renderMetrics(l,k)}`;ex.forEach((_,i)=>renderSuggestion(k,i))}
function parseRange(s){const m=s.match(/(\d+)[–-](\d+)/);return m?[+m[1],+m[2]]:[0,999]}
function lastExercise(day,name,before){const arr=Object.values(data.logs).filter(l=>l.day===day&&l.date<before).sort((a,b)=>b.date.localeCompare(a.date));for(const l of arr){const ex=(workouts[day]?.ex||sat).findIndex(x=>x[0]===name);if(ex>=0&&l.rows[ex])return l.rows[ex]}}
function renderSuggestion(k,i){const el=document.getElementById("sug"+i);if(!el)return;const l=data.logs[k],ex=(workouts[current]?.ex||sat)[i],r=l?.rows[i]||{},range=parseRange(ex[2]),reps=Array.from({length:ex[1]},(_,s)=>Number(r["reps"+s])).filter(Boolean);if(!reps.length)return;const last=lastExercise(current,ex[0],l.date),lastReps=last?Array.from({length:ex[1]},(_,s)=>Number(last["reps"+s])).filter(Boolean):[],avg=reps.reduce((a,b)=>a+b,0)/reps.length;el.innerHTML=reps.length>=ex[1]&&avg>=range[1]&&(!lastReps.length||avg>=lastReps.reduce((a,b)=>a+b,0)/lastReps.length)?'<span class="badge up">⬆ Pode aumentar</span>':avg<range[0]?'<span class="badge down">↘ Mantenha/reduza</span>':'<span class="badge keep">→ Mantenha</span>'}
async function clearDay(){if(!confirm("Apagar o treino de hoje?"))return;const k=key(current,today());delete data.logs[k];localSave();if(user&&cloudReady&&sb)await sb.from("workout_logs").delete().eq("user_id",user.id).eq("log_key",k);render()}
function metrics(logs){let sessions=logs.length,sets=0,reps=0,volume=0,calories=0;logs.forEach(l=>{calories+=Number(l.calories)||0;Object.values(l.rows||{}).forEach(r=>{for(const k in r)if(k.startsWith("reps")&&r[k]!==""){const q=Number(r[k])||0;reps+=q;sets++;volume+=(Number(r[k.replace("reps","kg")])||0)*q}})});return{sessions,sets,reps,volume,calories}}
function exerciseOptions(){const names=new Set();Object.values(workouts).forEach(w=>w.ex.forEach(e=>names.add(e[0])));sat.forEach(e=>names.add(e[0]));return [...names].sort((a,b)=>a.localeCompare(b,"pt-BR")).map(n=>`<option ${n===historyExercise?"selected":""}>${esc(n)}</option>`).join("")}
function exerciseHistory(){const matches=[];Object.values(data.logs).forEach(l=>{const ex=(workouts[l.day]?.ex||sat);ex.forEach((e,i)=>{if(e[0]!==historyExercise)return;const r=l.rows?.[i];if(!r)return;const sets=[];for(let s=0;s<e[1];s++){const kg=r["kg"+s],reps=r["reps"+s];if(kg!==undefined||reps!==undefined)sets.push(`${kg||"—"} kg × ${reps||"—"}`)}if(sets.length)matches.push({date:l.date,day:l.day,sets,duration:l.duration,bpm:l.avgBpm,cal:l.calories,effort:l.effort})})});matches.sort((a,b)=>b.date.localeCompare(a.date));return matches}
function history(){const rows=exerciseHistory();const last=rows[0];const max=rows.reduce((m,r)=>Math.max(m,...r.sets.map(x=>Number(x.split(" ")[0])||0)),0);document.getElementById("app").innerHTML=nav()+`<div class="card"><h2>📈 Histórico de progressão</h2><p class="muted">Aqui ficam registrados os exercícios, cargas e repetições de todos os treinos. Você poderá voltar meses depois e ver exatamente o que estava fazendo.</p><select class="exercise-select" onchange="historyExercise=this.value;history()">${exerciseOptions()}</select></div><div class="history-stat">${last?`<div class="metric"><span>Último treino</span><b>${dateBR(last.date)}</b></div><div class="metric"><span>Maior carga registrada</span><b>${max} kg</b></div><div class="metric"><span>Registros</span><b>${rows.length}</b></div>`:""}</div><div class="card" style="margin-top:14px"><h3>${esc(historyExercise)}</h3>${rows.length?rows.map(r=>`<div class="history-row"><b>${dateBR(r.date)} — ${esc(r.day)}</b><div style="margin-top:6px">${r.sets.map((s,i)=>`<span class="badge keep" style="margin:2px">S${i+1}: ${esc(s)}</span>`).join("")}</div><div class="muted" style="margin-top:6px">${r.duration?"⏱ "+esc(r.duration)+" • ":""}${r.bpm?"❤️ "+esc(r.bpm)+" bpm • ":"}${r.cal?"🔥 "+esc(r.cal)+" kcal • ":""}${r.effort?"💪 "+esc(r.effort)+"/10":""}</div></div>`).join(""):"<div class='empty'>Ainda não há registros desse exercício.</div>"}</div>`}
function report(){const logs=Object.values(data.logs).sort((a,b)=>b.date.localeCompare(a.date));const m=metrics(logs);document.getElementById("app").innerHTML=nav()+`<div class="card"><h2>📊 Relatório</h2><div class="metric"><span>Sessões</span><b>${m.sessions}</b></div><div class="metric"><span>Séries</span><b>${m.sets}</b></div><div class="metric"><span>Reps</span><b>${m.reps}</b></div><div class="metric"><span>Volume</span><b>${Math.round(m.volume).toLocaleString("pt-BR")} kg</b></div><div class="metric"><span>Calorias</span><b>${Math.round(m.calories)} kcal</b></div></div><div class="card scroll"><table><thead><tr><th>Data</th><th>Treino</th><th>Tempo</th><th>BPM</th><th>kcal</th><th>Esforço</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${dateBR(l.date)}</td><td>${esc(l.day)}</td><td>${esc(l.duration||"—")}</td><td>${esc(l.avgBpm||"—")}</td><td>${esc(l.calories||"—")}</td><td>${esc(l.effort||"—")}${l.effort?"/10":""}</td></tr>`).join("")}</tbody></table></div><div class="actions"><button class="primary" onclick="window.print()">🖨️ Imprimir / PDF</button></div>`}
function dataPage(){document.getElementById("app").innerHTML=nav()+`<div class="card"><h2>⚙️ Dados</h2><p>Conta: <b>${esc(user?.email||"não conectado")}</b></p><p class="muted">Os treinos são salvos no Supabase. O armazenamento local permanece como cópia de segurança.</p><div class="actions"><button class="primary" onclick="exportData()">⬇ Exportar backup</button><button onclick="document.getElementById('imp').click()">⬆ Importar backup</button><input id="imp" type="file" accept=".json" hidden onchange="importData(this)"><button onclick="signOut()">Sair da conta</button></div></div>`}
function exportData(){const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="backup-meu-treino-"+today()+".json";a.click();URL.revokeObjectURL(a.href)}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{data=JSON.parse(r.result);localSave();if(user&&cloudReady)for(const k of Object.keys(data.logs))await cloudSaveLog(k);render();alert("Backup importado e sincronizado.")}catch(e){alert("Backup inválido.")}};r.readAsText(f)}
function render(){if(!user){authPage();return}if(current==="Relatórios")report();else if(current==="Histórico")history();else if(current==="Dados")dataPage();else renderWorkout()}
function start(){makeClient();render();if(!sb){status("⚠ Serviço online indisponível — dados locais preservados",false);return}sb.auth.getSession().then(async({data:r})=>{user=r.session?.user||null;if(user){status("☁ Conectando…",true);await cloudLoad()}else render()}).catch(e=>{console.error(e);user=null;render()});sb.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;if(user&&!cloudReady)cloudLoad();else if(!user){cloudReady=false;render()}})}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
</script></body></html>
