<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Treino — Histórico e Progressão</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--txt:#17202a;--muted:#667085;--line:#e4e7ec;--blue:#2563eb;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#111827;color:#fff;padding:16px;position:sticky;top:0;z-index:10}.head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:21px;font-weight:800}.save{font-size:12px;color:#cbd5e1}
main{max-width:1200px;margin:16px auto;padding:0 12px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab{border:0;border-radius:10px;padding:10px 14px;font-weight:800;white-space:nowrap;cursor:pointer;background:#e5e7eb}.tab.active{background:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}h2{margin:0 0 8px;font-size:20px}h3{margin:18px 0 8px;font-size:16px}.muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase}.scroll{overflow:auto}
input,textarea,select{font:inherit;border:1px solid #d0d5dd;border-radius:8px;padding:8px;width:100%;background:#fff}button{border:0;border-radius:8px;padding:9px 12px;font-weight:750;cursor:pointer;background:#e5e7eb}.primary{background:var(--blue);color:#fff}.success{background:#dcfce7;color:#166534}.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.metric{display:inline-flex;flex-direction:column;min-width:125px;margin:4px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.metric b{font-size:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:12px;font-weight:800}.up{background:#dcfce7;color:#166534}.keep{background:#fef3c7;color:#92400e}.down{background:#fee2e2;color:#991b1b}.empty{padding:18px;text-align:center;color:var(--muted)}
canvas{width:100%;height:280px;border:1px solid var(--line);border-radius:10px;background:#fff}
@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}th:nth-child(3),td:nth-child(3){min-width:70px}}
@media print{header,.tabs,.actions,.no-print{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header><div class="head"><div class="title">🏋️ Meu Treino</div><div class="save" id="saveStatus">Salvando automaticamente…</div></div></header>
<main><div class="tabs" id="tabs"></div><div id="app"></div></main>

<script>
const KEY="meu_treino_pro_v2";
const workouts={
"Segunda":{icon:"🟢",title:"Pernas + Peito",ex:[
["Pêndulo",4,"6–10"],["Cadeira extensora",3,"10–15"],["Stiff com barra ou halteres",3,"8–10"],["Supino inclinado com halteres",4,"8–10"],["Supino reto máquina",3,"8–12"],["Crucifixo máquina",2,"12–15"],["Abdominal máquina",3,"12–15"]]},
"Terça":{icon:"🔵",title:"Costas + Bíceps",ex:[
["Barra fixa ou puxada neutra",4,"6–10"],["Remada articulada com apoio no peito",4,"8–12"],["Remada unilateral na polia",3,"10–12"],["Pullover na polia",3,"10–15"],["Rosca direta com barra W",3,"8–12"],["Rosca inclinada com halteres",3,"10–12"],["Rosca martelo com halteres",2,"10–12"]]},
"Quarta":{icon:"🟠",title:"Pernas + Ombros",ex:[
["Leg press 45°",4,"8–12"],["Cadeira flexora bilateral",4,"8–12"],["Afundo no Smith",3,"8–12 cada perna"],["Mesa flexora",3,"10–15"],["Desenvolvimento máquina",3,"8–10"],["Elevação lateral na polia",4,"10–15"],["Crucifixo inverso máquina",3,"12–15"],["Panturrilha em pé ou no leg press",4,"10–15"],["Abdominal máquina",3,"12–15"]]},
"Quinta":{icon:"🔴",title:"Peito + Tríceps",ex:[
["Supino reto com barra",4,"6–10"],["Supino inclinado máquina",3,"8–12"],["Chest press convergente",3,"8–12"],["Crossover de baixo para cima",2,"12–15"],["Tríceps francês unilateral na polia",3,"10–12"],["Tríceps barra V",3,"8–12"],["Tríceps testa com barra W",2,"10–12"]]},
"Sexta":{icon:"🟣",title:"Full Body + Pontos fracos",ex:[
["Hack squat",3,"8–12"],["Flexora unilateral",3,"10–12"],["Remada baixa triângulo",3,"8–12"],["Puxada alta pronada",3,"8–12"],["Supino inclinado com halteres",3,"8–12"],["Elevação lateral",3,"12–15"],["Rosca Scott máquina",2,"10–12"],["Tríceps corda",2,"10–15"],["Panturrilha",4,"12–15"],["Abdominal máquina",3,"12–15"]]}
};
const sat=[["Elevação lateral",3,"12–15"],["Crucifixo inverso",3,"12–15"],["Rosca martelo",3,"10–12"],["Tríceps corda",3,"10–12"],["Panturrilha",4,"12–15"]];
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{logs:{}};
let current="Segunda";

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function key(day,date){return day+"|"+date}
function dateBR(d){return new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})}
function save(){localStorage.setItem(KEY,JSON.stringify(data));document.getElementById("saveStatus").textContent="✓ Salvo automaticamente • "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function ensure(k,day,date){if(!data.logs[k])data.logs[k]={day,date,rows:{},notes:""};return data.logs[k]}
function tabs(){
 let h=Object.keys(workouts).map(d=>`<button class="tab ${current==d?"active":""}" onclick="go('${d}')">${workouts[d].icon} ${d}</button>`).join("");
 h+=`<button class="tab ${current=="Sábado"?"active":""}" onclick="go('Sábado')">🟣 Sábado*</button>`;
 h+=`<button class="tab ${current=="Relatórios"?"active":""}" onclick="go('Relatórios')">📊 Relatórios</button>`;
 h+=`<button class="tab ${current=="Histórico"?"active":""}" onclick="go('Histórico')">📈 Histórico</button>`;
 h+=`<button class="tab ${current=="Dados"?"active":""}" onclick="go('Dados')">⚙️ Dados</button>`;
 document.getElementById("tabs").innerHTML=h;
}
function go(x){current=x;render()}
function setsFor(row,n,i,k){let out="";for(let s=0;s<n;s++)out+=`<div class="grid"><input type="number" step="0.5" placeholder="kg" value="${esc(row?.["kg"+s]??"")}" onchange="put('${k}',${i},${s},'kg',this.value)"><input type="number" placeholder="reps" value="${esc(row?.["reps"+s]??"")}" onchange="put('${k}',${i},${s},'reps',this.value)"></div>`;return out}
function put(k,i,s,f,v){let l=ensure(k,current,today());l.rows[i]??={};l.rows[i][f+s]=v;save();renderSuggestion(k,i)}
function setObservation(k,i,v){let l=ensure(k,current,today());l.rows[i]??={};l.rows[i].observation=v;save()}
function renderWorkout(){
 let ex=current=="Sábado"?sat:workouts[current].ex,d=today(),k=key(current,d),l=ensure(k,current,d);
 let rows=ex.map((e,i)=>{let r=l.rows[i]||{};return `<tr><td><b>${i+1}. ${esc(e[0])}</b><div class="muted">Meta ${e[2]} • ${e[1]} séries</div></td><td>${setsFor(r,e[1],i,k)}</td><td><textarea rows="2" placeholder="Observação deste exercício" onchange="setObservation('${k}',${i},this.value)">${esc(r.observation??"")}</textarea><div id="sug${i}" class="muted" style="margin-top:5px"></div></td></tr>`}).join("");
 document.getElementById("app").innerHTML=`<div class="card"><h2>${workouts[current]?.icon||"🟣"} ${current} — ${workouts[current]?.title||"Treino opcional"}</h2><div class="muted">${dateBR(d)} • Os dados são salvos a cada alteração.</div></div>
 <div class="card scroll"><table><thead><tr><th>Exercício</th><th>Séries — kg / reps</th><th>RIR</th></tr></thead><tbody>${rows}</tbody></table>
 <h3>Observações</h3><textarea rows="3" onchange="ensure('${k}','${current}','${d}').notes=this.value;save()" placeholder="Energia, dor, técnica, falha…">${esc(l.notes||"")}</textarea>
 <div class="actions"><button class="primary" onclick="printDay()">🖨️ Relatório diário</button><button onclick="clearDay()">Limpar dia</button></div></div>`;
 ex.forEach((_,i)=>renderSuggestion(k,i));
}
function parseRange(s){let m=s.match(/(\d+)[–-](\d+)/);return m?[+m[1],+m[2]]:[0,999]}
function lastExercise(day,name,before){
 let arr=Object.values(data.logs).filter(l=>l.day===day&&l.date<before).sort((a,b)=>b.date.localeCompare(a.date));
 for(let l of arr){let ex=(workouts[day]?.ex||sat).findIndex(x=>x[0]===name);if(ex>=0&&l.rows[ex])return l.rows[ex]}
}
function renderSuggestion(k,i){
 let el=document.getElementById("sug"+i);if(!el)return;
 let l=data.logs[k], ex=(workouts[current]?.ex||sat)[i],r=l?.rows[i]||{},range=parseRange(ex[2]);
 let reps=Array.from({length:ex[1]},(_,s)=>Number(r["reps"+s])).filter(Boolean);
 if(!reps.length){el.textContent="";return}
 let last=lastExercise(current,ex[0],l.date);
 let lastReps=last?Array.from({length:ex[1]},(_,s)=>Number(last["reps"+s])).filter(Boolean):[];
 let avg=reps.reduce((a,b)=>a+b,0)/reps.length;
 let msg="";
 if(reps.length>=ex[1]&&avg>=range[1]&&(!lastReps.length||avg>=lastReps.reduce((a,b)=>a+b,0)/lastReps.length))msg=`<span class="badge up">⬆ Pode aumentar</span>`;
 else if(avg<range[0])msg=`<span class="badge down">↘ Mantenha/reduza</span>`;
 else msg=`<span class="badge keep">→ Mantenha</span>`;
 el.innerHTML=msg;
}
function clearDay(){if(confirm("Apagar o treino de hoje?")){delete data.logs[key(current,today())];save();render()}}
function weekStart(){let d=new Date(),n=d.getDay(),diff=n===0?-6:1-n;d.setDate(d.getDate()+diff);return d.toISOString().slice(0,10)}
function datesOfWeek(){let s=new Date(weekStart()+"T12:00:00");return Array.from({length:7},(_,i)=>{let d=new Date(s);d.setDate(s.getDate()+i);return d.toISOString().slice(0,10)})}
function metrics(logs){let sessions=logs.length,sets=0,reps=0,volume=0;logs.forEach(l=>Object.values(l.rows||{}).forEach(r=>{for(let k in r)if(k.startsWith("reps")&&r[k]!=""){let q=Number(r[k])||0;reps+=q;sets++;volume+=(Number(r[k.replace("reps","kg")])||0)*q}}));return {sessions,sets,reps,volume};}
function report(){
 let ds=datesOfWeek(),logs=Object.values(data.logs).filter(l=>ds.includes(l.date)),m=metrics(logs);
 let rows=ds.map(d=>{let ls=logs.filter(l=>l.date===d),x=metrics(ls);return `<tr><td>${dateBR(d)}</td><td>${ls.map(l=>l.day).join(", ")||"—"}</td><td>${x.sets}</td><td>${x.reps}</td><td>${Math.round(x.volume).toLocaleString("pt-BR")} kg</td></tr>`}).join("");
 document.getElementById("app").innerHTML=`<div class="card"><h2>📊 Relatório semanal</h2>
 <div class="metric"><span>Sessões</span><b>${m.sessions}</b></div><div class="metric"><span>Séries</span><b>${m.sets}</b></div><div class="metric"><span>Reps</span><b>${m.reps}</b></div><div class="metric"><span>Volume</span><b>${Math.round(m.volume).toLocaleString("pt-BR")} kg</b></div>
 <div class="actions"><button class="primary" onclick="window.print()">🖨️ Imprimir / PDF</button><button onclick="exportData()">⬇ Backup</button></div></div>
 <div class="card scroll"><h3>Resumo por dia</h3><table><thead><tr><th>Dia</th><th>Treino</th><th>Séries</th><th>Reps</th><th>Volume</th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="card"><h3>Evolução semanal</h3><canvas id="chart" width="1000" height="280"></canvas></div>`;
 drawChart(ds,logs);
}
function drawChart(ds,logs){
 let c=document.getElementById("chart"),ctx=c.getContext("2d"),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);
 let vals=ds.map(d=>metrics(logs.filter(l=>l.date===d)).volume),max=Math.max(...vals,1),pad=45;
 ctx.strokeStyle="#d0d5dd";ctx.beginPath();ctx.moveTo(pad,20);ctx.lineTo(pad,h-35);ctx.lineTo(w-15,h-35);ctx.stroke();
 ctx.strokeStyle="#2563eb";ctx.lineWidth=3;ctx.beginPath();
 vals.forEach((v,i)=>{let x=pad+i*(w-pad-25)/(vals.length-1||1),y=h-35-(v/max)*(h-60);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
 ctx.stroke();ctx.fillStyle="#17202a";ctx.font="12px system-ui";
 vals.forEach((v,i)=>{let x=pad+i*(w-pad-25)/(vals.length-1||1),y=h-35-(v/max)*(h-60);ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.fillText((v?Math.round(v):0)+"kg",x-15,y-10);ctx.fillText(ds[i].slice(5),x-14,h-14)});
}
function history(){
 let logs=Object.values(data.logs).sort((a,b)=>b.date.localeCompare(a.date)), groups={};
 logs.forEach(l=>{groups[l.date]??=[];groups[l.date].push(l)});
 let html=Object.keys(groups).map(d=>`<div class="card"><h3>${dateBR(d)}</h3>${groups[d].map(l=>{let m=metrics([l]);return `<div><b>${l.day}</b> — ${m.sets} séries • ${m.reps} reps • ${Math.round(m.volume).toLocaleString("pt-BR")} kg</div>`}).join("")}</div>`).join("");
 document.getElementById("app").innerHTML=`<div class="card"><h2>📈 Histórico</h2><div class="muted">Todos os treinos registrados neste navegador.</div></div>${html||'<div class="card empty">Ainda não há treinos registrados.</div>'}`;
}
function dataPage(){
 document.getElementById("app").innerHTML=`<div class="card"><h2>⚙️ Dados</h2><p>O aplicativo salva automaticamente cada alteração no navegador deste aparelho.</p><p class="muted">Para trocar de aparelho, faça um backup JSON e importe no novo navegador.</p><div class="actions"><button class="primary" onclick="exportData()">⬇ Exportar backup</button><button onclick="document.getElementById('imp').click()">⬆ Importar backup</button><input id="imp" type="file" accept=".json" hidden onchange="importData(this)"><button class="danger" onclick="if(confirm('Apagar todos os registros?')){data={logs:{}};save();render()}">Apagar tudo</button></div></div>
 <div class="card"><h2>🔥 Regra de progressão</h2><p>6–10 reps: mantenha a carga até atingir o topo da faixa nas séries; depois aumente e volte para a parte baixa. 10–15 reps: mesma lógica.</p><p>Descanso: 2–3 min nos exercícios grandes; 60–90 s nos isoladores.</p></div>`;
}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="backup-meu-treino-"+today()+".json";a.click();URL.revokeObjectURL(a.href)}
function importData(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();render();alert("Backup importado.");}catch(e){alert("Backup inválido.")}};r.readAsText(f)}
function printDay(){window.print()}
function render(){tabs();if(current=="Relatórios")report();else if(current=="Histórico")history();else if(current=="Dados")dataPage();else renderWorkout()}
render();
</script>
</body>
</html>
